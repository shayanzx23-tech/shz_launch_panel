<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#050507">
<title>SHZ • Launcher</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:#030305;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(circle at 50% 10%,rgba(180,0,20,.20),transparent 32%),
        radial-gradient(circle at 15% 85%,rgba(100,0,10,.12),transparent 30%),
        #030305;
}

.grid{
    position:fixed;
    inset:0;
    z-index:-4;
    opacity:.16;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
}

.glow{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(220,0,25,.10);
    filter:blur(100px);
    top:-180px;
    left:50%;
    transform:translateX(-50%);
    z-index:-3;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
}

.container{
    width:100%;
    max-width:460px;
}

.top{
    text-align:center;
    margin-bottom:28px;
}

.logo-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-bottom:13px;
}

.logo{
    position:relative;
    font-size:72px;
    line-height:1;
    font-weight:900;
    letter-spacing:-6px;
    font-style:italic;
    color:#fff;
    text-shadow:
        0 0 20px rgba(255,20,35,.20),
        0 0 45px rgba(255,0,20,.10);
}

.logo span{
    color:#e50920;
    text-shadow:
        0 0 15px rgba(255,0,30,.65),
        0 0 35px rgba(255,0,30,.25);
}

.logo-line{
    position:absolute;
    bottom:-5px;
    left:5px;
    width:92px;
    height:3px;
    background:linear-gradient(90deg,#ff142e,transparent);
    transform:skewX(-35deg);
    box-shadow:0 0 12px rgba(255,0,30,.7);
}

.brand{
    font-size:10px;
    letter-spacing:6px;
    color:#777;
    font-weight:600;
}

.card{
    position:relative;
    background:
        linear-gradient(145deg,rgba(25,25,29,.88),rgba(7,7,9,.94));
    border:1px solid rgba(255,255,255,.07);
    border-radius:28px;
    padding:30px 25px 25px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter:blur(18px);
    overflow:hidden;
}

.card:before{
    content:"";
    position:absolute;
    top:0;
    left:12%;
    right:12%;
    height:1px;
    background:linear-gradient(90deg,transparent,#e50920,transparent);
    box-shadow:0 0 18px rgba(229,9,32,.45);
}

.card:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-100px;
    top:-100px;
    border-radius:50%;
    background:rgba(200,0,20,.10);
    filter:blur(35px);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.4px;
}

.subtitle{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

.live{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border-radius:50px;
    background:rgba(40,180,90,.07);
    border:1px solid rgba(60,220,110,.13);
    color:#5ee88b;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#48e77c;
    box-shadow:0 0 9px #48e77c;
}

.field-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    padding:0 2px;
}

.field-title span:first-child{
    font-size:10px;
    color:#aaa;
    font-weight:700;
    letter-spacing:1.5px;
}

.field-title span:last-child{
    font-size:9px;
    color:#555;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:16px;
    pointer-events:none;
}

input{
    width:100%;
    height:58px;
    border-radius:15px;
    border:1px solid #25252a;
    outline:none;
    background:#08080a;
    color:#fff;
    padding:0 15px 0 46px;
    font-family:Inter,Arial,sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:.3px;
    transition:.25s;
}

input::placeholder{
    color:#444;
    font-weight:500;
}

input:focus{
    border-color:rgba(229,9,32,.7);
    box-shadow:
        0 0 0 3px rgba(229,9,32,.07),
        0 0 25px rgba(229,9,32,.08);
}

.launch{
    position:relative;
    width:100%;
    height:59px;
    margin-top:16px;
    border:0;
    border-radius:15px;
    cursor:pointer;
    overflow:hidden;
    color:#fff;
    background:linear-gradient(135deg,#ff263b 0%,#d6001c 45%,#970014 100%);
    font-family:Inter,Arial,sans-serif;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    box-shadow:
        0 13px 30px rgba(210,0,25,.22),
        inset 0 1px 0 rgba(255,255,255,.2);
    transition:.2s;
}

.launch:before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:-100%;
    width:60%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.17),transparent);
    transform:skewX(-20deg);
    transition:.6s;
}

.launch:hover:before{
    left:140%;
}

.launch:active{
    transform:scale(.985);
}

.launch:disabled{
    cursor:not-allowed;
    opacity:.55;
    transform:none;
}

.launch-content{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.rocket{
    font-size:17px;
}

.status{
    margin-top:17px;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px;
    border-radius:13px;
    background:#08080a;
    border:1px solid #18181c;
    color:#555;
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    transition:.25s;
}

.status.ready{
    color:#59e98a;
    border-color:rgba(70,220,120,.16);
    background:rgba(30,150,70,.035);
}

.status.error{
    color:#ff5967;
    border-color:rgba(255,30,50,.17);
    background:rgba(180,0,20,.035);
}

.status.loading{
    color:#ffb454;
    border-color:rgba(255,170,50,.15);
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:13px;
}

.info-box{
    padding:14px;
    border-radius:13px;
    background:rgba(255,255,255,.018);
    border:1px solid rgba(255,255,255,.045);
}

.info-label{
    font-size:8px;
    color:#555;
    letter-spacing:1.5px;
    font-weight:700;
}

.info-value{
    margin-top:6px;
    font-size:10px;
    color:#aaa;
    font-weight:600;
}

.footer{
    text-align:center;
    margin-top:21px;
    color:#333;
    font-size:8px;
    letter-spacing:2.5px;
    font-weight:700;
}

.spinner{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:430px){

    .page{
        padding:20px 14px;
    }

    .logo{
        font-size:64px;
    }

    .card{
        padding:26px 19px 21px;
        border-radius:23px;
    }

    .title{
        font-size:16px;
    }
}

@media(min-width:700px){

    .card{
        padding:34px 31px 28px;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="glow"></div>

<main class="page">

<div class="container">

<header class="top">

<div class="logo-wrap">

<div class="logo">
SH<span>Z</span>
</div>

<div class="logo-line"></div>

</div>

<div class="brand">
SIGNAL LAUNCH SYSTEM
</div>

</header>

<section class="card">

<div class="card-header">

<div>

<div class="title">
Launch Center
</div>

<div class="subtitle">
Connect your SHZ license
</div>

</div>

<div class="live">

<div class="dot"></div>

ONLINE

</div>

</div>

<div class="field-title">

<span>
LICENSE TOPIC
</span>

<span>
SECURED
</span>

</div>

<div class="input-wrap">

<div class="input-icon">
⌁
</div>

<input
id="topic"
type="text"
placeholder="shz-xxxxxxxx"
autocomplete="off"
autocapitalize="none"
spellcheck="false"
>

</div>

<button
id="launchBtn"
class="launch"
onclick="launch()"
>

<span
class="launch-content"
id="buttonContent"
>

<span class="rocket">
🚀
</span>

<span>
LAUNCH APPLICATION
</span>

</span>

</button>

<div
id="status"
class="status"
>
ENTER YOUR LICENSE TOPIC
</div>

<div class="info">

<div class="info-box">

<div class="info-label">
SYSTEM
</div>

<div class="info-value">
SHZ SIGNAL
</div>

</div>

<div class="info-box">

<div class="info-label">
STATUS
</div>

<div
class="info-value"
id="systemStatus"
>
READY
</div>

</div>

</div>

</section>

<footer class="footer">
SHZ • SECURE SIGNAL INFRASTRUCTURE
</footer>

</div>

</main>

<script>

const LAUNCH_URL =
"https://glkgppmuwaaemvodebgc.supabase.co/functions/v1/buyer-launch";

const SHZ_URL =
"shzlauncher://launch";

const topicInput =
document.getElementById("topic");

const button =
document.getElementById("launchBtn");

const buttonContent =
document.getElementById("buttonContent");

const statusBox =
document.getElementById("status");

const systemStatus =
document.getElementById("systemStatus");


function setStatus(text,type=""){

    statusBox.textContent = text;

    statusBox.className =
        "status " + type;
}


function resetButton(){

    button.disabled = false;

    buttonContent.innerHTML =
        '<span class="rocket">🚀</span>' +
        '<span>LAUNCH APPLICATION</span>';

    systemStatus.textContent = "READY";
}


function openSHZ(){

    setStatus(
        "LAUNCH SIGNAL SENT • OPENING SHZ...",
        "ready"
    );

    systemStatus.textContent = "OPENING SHZ";

    buttonContent.innerHTML =
        '<span>✓</span>' +
        '<span>OPENING SHZ...</span>';

    /*
     SHZ must have the URL Scheme:
     shzlauncher
    */

    window.location.href = SHZ_URL;

    /*
     If iPadOS does not open SHZ,
     the page remains usable.
    */

    setTimeout(() => {

        resetButton();

    }, 5000);
}


async function launch(){

    const topic =
        topicInput.value.trim();

    if(!topic){

        setStatus(
            "ENTER YOUR LICENSE TOPIC",
            "error"
        );

        return;
    }


    button.disabled = true;

    buttonContent.innerHTML =
        '<div class="spinner"></div>' +
        '<span>CHECKING LICENSE...</span>';

    systemStatus.textContent =
        "CHECKING";

    setStatus(
        "VERIFYING YOUR SHZ LICENSE...",
        "loading"
    );


    try{

        const response =
            await fetch(
                LAUNCH_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            topic:topic
                        })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            if(
                data.error ===
                "INVALID_TOPIC"
            ){

                setStatus(
                    "INVALID LICENSE TOPIC",
                    "error"
                );

            }

            else if(
                data.error ===
                "LICENSE_DISABLED"
            ){

                setStatus(
                    "LICENSE IS DISABLED",
                    "error"
                );

            }

            else if(
                data.error ===
                "LICENSE_EXPIRED"
            ){

                setStatus(
                    "LICENSE HAS EXPIRED",
                    "error"
                );

            }

            else{

                setStatus(
                    data.error ||
                    "LAUNCH FAILED",
                    "error"
                );

            }

            systemStatus.textContent =
                "ERROR";

            resetButton();

            return;
        }


        /*
         Server accepted the command.
         Now open SHZ.
        */

        openSHZ();


    }

    catch(error){

        setStatus(
            "CONNECTION ERROR",
            "error"
        );

        systemStatus.textContent =
            "OFFLINE";

        resetButton();
    }
}


topicInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            launch();
        }
    }
);


topicInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\s/g,"")
                .trim();
    }
);

</script>

</body>
</html>
